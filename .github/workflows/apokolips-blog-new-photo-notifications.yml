name: Notify Apokolips Blog readers about new photos

on:
  push:
    branches: [main]
    paths:
      - 'blog.html'

permissions:
  contents: read

jobs:
  notify-readers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect newly published blog photos
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            echo "Initial commit detected; skipping historical photo notifications."
            exit 0
          fi
          git show "${BEFORE_SHA}:blog.html" > /tmp/old-blog.html 2>/dev/null || true
          git show "${AFTER_SHA}:blog.html" > /tmp/new-blog.html
          node > /tmp/new-blog-photos.txt <<'NODE'
          const fs = require("fs");
          const imagePattern = /\.(?:jpe?g|png|webp|gif)(?:[?#].*)?$/i;
          const extract = (html) => {
            const found = new Set();
            for (const match of html.matchAll(/<img\b[^>]*\bsrc\s*=\s*["']([^"']+)["']/gi)) {
              const src = match[1].trim();
              if (imagePattern.test(src)) found.add(src);
            }
            return found;
          };
          const before = extract(fs.readFileSync("/tmp/old-blog.html", "utf8"));
          const after = extract(fs.readFileSync("/tmp/new-blog.html", "utf8"));
          for (const src of after) if (!before.has(src)) console.log(src);
          NODE
          if [[ ! -s /tmp/new-blog-photos.txt ]]; then
            echo "No newly referenced blog photos found."
            exit 0
          fi

      - name: Create new-photo notifications in Neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEON_DATABASE_URL}" ]]; then
            echo "Missing NEON_DATABASE_URL repository secret."
            exit 1
          fi
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          while IFS= read -r image_src; do
            [[ -z "${image_src}" ]] && continue
            psql "${NEON_DATABASE_URL}" -v ON_ERROR_STOP=1 -v file_path="${image_src}" <<'SQL'
            INSERT INTO public.apokolips_blog_media_events(file_path)
            VALUES (:'file_path')
            ON CONFLICT (file_path) DO NOTHING;
          SQL
            echo "Created new-photo notification event for ${image_src}"
          done < /tmp/new-blog-photos.txt
