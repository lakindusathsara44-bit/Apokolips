name: Notify Apokolips Blog readers about new photos

on:
  push:
    branches: [main]
    paths:
      - 'blog.html'
      - 'blog-app/src/BlogApp.js'

permissions:
  contents: read

jobs:
  notify-readers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect newly published Blog photos
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            echo "Initial commit detected; skipping historical photo notifications."
            exit 0
          fi
          : > /tmp/old-blog-source.txt
          : > /tmp/new-blog-source.txt
          for file in blog.html blog-app/src/BlogApp.js; do
            git show "${BEFORE_SHA}:${file}" >> /tmp/old-blog-source.txt 2>/dev/null || true
            git show "${AFTER_SHA}:${file}" >> /tmp/new-blog-source.txt
          done
          node > /tmp/new-blog-photos.txt <<'NODE'
          const fs = require("fs");
          const imagePattern = /\.(?:jpe?g|png|webp|gif)(?:[?#].*)?$/i;
          const extract = (source) => {
            const found = new Set();
            const pattern = /(?:\bsrc\s*=|\bsrc\s*:)[\s]*["']([^"']+)["']/gi;
            for (const match of source.matchAll(pattern)) {
              const src = match[1].trim();
              if (imagePattern.test(src)) found.add(src);
            }
            return found;
          };
          const before = extract(fs.readFileSync("/tmp/old-blog-source.txt", "utf8"));
          const after = extract(fs.readFileSync("/tmp/new-blog-source.txt", "utf8"));
          for (const src of after) if (!before.has(src)) console.log(src);
          NODE
          if [[ ! -s /tmp/new-blog-photos.txt ]]; then
            echo "No newly referenced Blog photos found."
            exit 0
          fi

      - name: Create new-photo notification events in Neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEON_DATABASE_URL}" ]]; then
            echo "::warning::NEON_DATABASE_URL is not configured; skipping new-photo notifications."
            exit 0
          fi
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          while IFS= read -r image_src; do
            [[ -z "${image_src}" ]] && continue
            psql "${NEON_DATABASE_URL}" -v ON_ERROR_STOP=1 -v file_path="${image_src}" \
              -c "SELECT public.apokolips_blog_register_media_event(:'file_path');"
            echo "Created new-photo notification event for ${image_src}"
          done < /tmp/new-blog-photos.txt
