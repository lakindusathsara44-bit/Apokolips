name: Build Apokolips About Page (Vite)

on:
  push:
    branches:
      - main
    paths:
      - 'info.html'
      - 'info-app/**'
      - 'info.vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-info.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'info.html'
      - 'info-app/**'
      - 'info.vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-info.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apokolips-info-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build React + Vite About page
        run: npm run build

      - name: Verify generated files
        run: |
          test -s assets/info/info.js
          test -s assets/info/info.css
          echo "Verified About page bundles."

      - name: Commit generated assets
        if: github.event_name == 'push'
        run: |
          git add -f assets/info/info.js assets/info/info.css
          if git diff --cached --quiet; then
            echo "Generated About page assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build React Vite About page assets"
          git push origin HEAD:main
