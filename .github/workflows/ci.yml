name: Apokolips CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apokolips-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static-site:
    name: Verify static website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Test persistent Blog visitor identity
        run: node --test blog-app/tests/*.test.mjs

      - name: Build React + Vite pages
        run: npm run build

      - name: Build Community static assets
        run: npm run build:community

      - name: Check required files, HTML references, and sitemap
        run: python .github/scripts/verify_site.py

      - name: Test NEXIST Python core
        working-directory: nexist-core
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke-test NEXIST quickstart
        working-directory: nexist-core
        run: python -m examples.quickstart

      - name: Smoke-test evidence-aware lifecycle example
        working-directory: nexist-core
        run: python -m examples.evidence_lifecycle

      - name: Smoke-test NEXIST Q-Intelligence example
        working-directory: nexist-core
        run: python -m examples.q_intelligence

      - name: Check inline NEXIST demo JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for page in ("nexist-evidence.html", "nexist-qintelligence.html"):
              source = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", source, re.DOTALL)
              if not scripts:
                  raise SystemExit(f"No inline demo script found in {page}.")
              output = Path("/tmp") / (page + ".inline.js")
              output.write_text("\n".join(scripts), encoding="utf-8")
              print(f"Extracted inline script from {page}")
          PY
          node --check /tmp/nexist-evidence.html.inline.js
          node --check /tmp/nexist-qintelligence.html.inline.js

      - name: Check NEXIST Q-Intelligence server adapter
        run: node --check neon-functions/nxqai/index.mjs

      - name: Test NEXIST Q-Intelligence AI adapter
        run: node --test neon-functions/nxqai/tests.mjs

      - name: Check NEXIST Q-Intelligence page JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("nexist-qintelligence.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, re.DOTALL)
          if not scripts:
              raise SystemExit("No inline Q-Intelligence script found.")
          Path("/tmp/nexist-qintelligence-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/nexist-qintelligence-inline.js

      - name: Check inline NEXIST evidence page JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("nexist-evidence.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, re.DOTALL)
          if not scripts:
              raise SystemExit("No inline demo script found.")
          Path("/tmp/nexist-evidence-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/nexist-evidence-inline.js

      - name: Test NEXIST comparative research workload
        working-directory: nexist-core
        run: python -m unittest tests.test_research -v

      - name: Benchmark NEXIST against conventional Python baseline
        working-directory: nexist-core
        run: python -m benchmarks.equivalent_workload --sizes 100,1000 --rounds 3

      - name: Compile NEXIST Python modules
        working-directory: nexist-core
        run: python -m compileall -q nexist examples benchmarks tests

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check assets/home/site-search.js
          node --check visitor-counter.js
          node --check blog-app/src/BlogApp.js
          node --check blog-app/src/neon.js
          node --check blog-app/src/ShareFolder.js
          node --check neon-functions/share/index.mjs
          base64 -d neon-functions/share/function.zip.b64 > /tmp/aposhare-function.zip
          unzip -p /tmp/aposhare-function.zip index.mjs > /tmp/aposhare-index.mjs
          node --check /tmp/aposhare-index.mjs
          node --check blog-app/src/main.js
