<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">APOLONIA humanoid assistant</title>
  <desc id="desc">A compact friendly robot in navy, silver and cyan, with expressive eyes, a movable head and connected articulated arms.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e8f8ff"/><stop offset=".38" stop-color="#8bbbd6"/><stop offset=".72" stop-color="#356b91"/><stop offset="1" stop-color="#102d4a"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5fcff"/><stop offset=".42" stop-color="#b5d8e9"/><stop offset="1" stop-color="#5c91b5"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#69dfff"/><stop offset=".3" stop-color="#20577d"/><stop offset=".72" stop-color="#0b2742"/><stop offset="1" stop-color="#061324"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#173b5b"/><stop offset=".55" stop-color="#0a1e35"/><stop offset="1" stop-color="#071324"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2ffff"/><stop offset=".42" stop-color="#8cf0ff"/><stop offset="1" stop-color="#22a9d9"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="100" cy="226" rx="57" ry="5" fill="#020a15" opacity=".62"/>

  <!-- Torso and waist -->
  <g id="torso">
    <path d="M80 135h40l4 20H76l4-20z" fill="url(#armor)" stroke="#07182d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M83 155h34v8H83z" fill="#0a2742" stroke="#07182d" stroke-width="2"/>
    <path d="M78 163h44l6 22c-14 8-42 8-56 0l6-22z" fill="url(#shell)" stroke="#07182d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M84 168h32l3 11c-12 5-26 5-38 0z" fill="#dff7ff" opacity=".8"/>
    <circle cx="100" cy="176" r="4.5" fill="#0b2a46" stroke="#70e4ff" stroke-width="2"/>
    <path d="M100 174v4" stroke="#e7fdff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M82 140h36" stroke="#f4ffff" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Legs remain attached to the waist assembly -->
  <g id="legs">
    <path d="M74 188h22v34H66c-4 0-6-4-6-10 0-12 6-24 14-24z" fill="url(#armor)" stroke="#07182d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M104 188h22c8 0 14 12 14 24 0 6-2 10-6 10h-30v-34z" fill="url(#armor)" stroke="#07182d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M82 196v25M118 196v25M64 214h18M118 214h18" stroke="#16466a" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M70 220h20M110 220h20" stroke="#69dfff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Complete arm groups: the shoulder, arm shell and hand rotate as one connected unit. -->
  <g id="leftArm" class="arm">
    <path d="M74 148l-14 32 14 6 12-30z" fill="url(#armor)" stroke="#07182d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M73 155l-8 21" stroke="#ffffff" stroke-opacity=".85" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="67" cy="179" r="5.5" fill="#0c2e4b" stroke="#73e6ff" stroke-width="2"/>
    <circle cx="67" cy="179" r="2" fill="#d9fbff"/>
    <circle cx="76" cy="144" r="9" fill="url(#armor)" stroke="#07182d" stroke-width="3.5"/>
    <circle cx="76" cy="144" r="4" fill="#0a2b47" stroke="#69ddff" stroke-width="2"/>
    <g id="leftHand">
      <path d="M58 180l-5 10 6-2 2 9 5-7 4 7 4-9" fill="#0a2a46" stroke="#07182d" stroke-width="2" stroke-linejoin="round"/>
      <path d="M60 183l-1 8M67 185l-1 7" stroke="#8cecff" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </g>

  <g id="rightArm" class="arm">
    <path d="M126 148l14 32-14 6-12-30z" fill="url(#armor)" stroke="#07182d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M127 155l8 21" stroke="#ffffff" stroke-opacity=".85" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="133" cy="179" r="5.5" fill="#0c2e4b" stroke="#73e6ff" stroke-width="2"/>
    <circle cx="133" cy="179" r="2" fill="#d9fbff"/>
    <circle cx="124" cy="144" r="9" fill="url(#armor)" stroke="#07182d" stroke-width="3.5"/>
    <circle cx="124" cy="144" r="4" fill="#0a2b47" stroke="#69ddff" stroke-width="2"/>
    <g id="rightHand">
      <path d="M142 180l5 10-6-2-2 9-5-7-4 7-4-9" fill="#0a2a46" stroke="#07182d" stroke-width="2" stroke-linejoin="round"/>
      <path d="M140 183l1 8M133 185l1 7" stroke="#8cecff" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Neck -->
  <g id="neck">
    <path d="M88 128h24v10H88z" fill="#0b2b48" stroke="#07182d" stroke-width="2"/>
    <path d="M92 130h16v5H92z" fill="#70e5ff" opacity=".7"/>
  </g>

  <!-- Head assembly includes ears, helmet, face plate and all expressions. -->
  <g id="headPivot">
    <g id="ears">
      <rect x="20" y="58" width="24" height="44" rx="12" fill="url(#armor)" stroke="#07182d" stroke-width="3.5"/>
      <path d="M29 72c-2 4-2 12 0 16" stroke="#1d567c" stroke-width="3" stroke-linecap="round"/>
      <rect x="156" y="58" width="24" height="44" rx="12" fill="url(#armor)" stroke="#07182d" stroke-width="3.5"/>
      <path d="M171 72c2 4 2 12 0 16" stroke="#1d567c" stroke-width="3" stroke-linecap="round"/>
    </g>

    <path d="M32 68C32 28 60 12 100 12s68 16 68 56v36c0 16-8 28-18 28-4 0-6-4-6-9v-6H56v6c0 5-2 9-6 9-10 0-18-12-18-28V68z" fill="url(#helmet)" stroke="#07182d" stroke-width="4"/>
    <path d="M104 18c24 2 46 12 52 38" stroke="#a8f3ff" stroke-width="3" stroke-linecap="round" opacity=".9"/>

    <path d="M54 46c14-6 78-6 92 0 4 12 5 46-2 64-8 14-26 18-44 18s-36-4-44-18c-7-18-6-52-2-64z" fill="url(#face)" stroke="#07182d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M54 56c18-4 74-4 92 0" stroke="#6edfff" stroke-width="2.5" opacity=".75"/>
    <rect x="91" y="42" width="18" height="18" rx="3" fill="#173d5d" stroke="#69dfff" stroke-width="2.5"/>
    <path d="M94 46h12M94 50h12M94 54h12" stroke="#c1f7ff" stroke-width="1.7"/>
    <circle cx="72" cy="49" r="3" stroke="#8deaff" stroke-width="2.2"/>
    <circle cx="128" cy="49" r="3" stroke="#8deaff" stroke-width="2.2"/>

    <g id="eyes">
      <ellipse cx="76" cy="90" rx="14" ry="17" fill="#041426" stroke="#8cecff" stroke-width="1.5"/>
      <circle cx="72" cy="85" r="6" fill="#e8fdff"/>
      <circle cx="81" cy="96" r="2.5" fill="#8cecff"/>
      <path d="M63 78l-7-5M62 84l-8-2M62 90l-8 1M64 96l-7 4" stroke="#8cecff" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="124" cy="90" rx="14" ry="17" fill="#041426" stroke="#8cecff" stroke-width="1.5"/>
      <circle cx="120" cy="85" r="6" fill="#e8fdff"/>
      <circle cx="129" cy="96" r="2.5" fill="#8cecff"/>
      <path d="M137 78l7-5M138 84l8-2M138 90l8 1M136 96l7 4" stroke="#8cecff" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g id="pupils">
      <ellipse id="pupilLeft" cx="76" cy="90" rx="3.2" ry="5.5" fill="#03101f"/>
      <ellipse id="pupilRight" cx="124" cy="90" rx="3.2" ry="5.5" fill="#03101f"/>
    </g>
    <g id="eyelids" opacity="0">
      <path d="M60 82Q76 66 92 82L92 93Q76 98 60 93Z M108 82Q124 66 140 82L140 93Q124 98 108 93Z" fill="#07182d" stroke="#69ddff" stroke-width="1.4"/>
    </g>
    <g id="mouthGroup">
      <path id="mouthLine" d="M91 113q9 5 18 0" stroke="#9af1ff" stroke-width="3" stroke-linecap="round"/>
      <path id="mouthOpen" d="M91 112q9 14 18 0q-1 14-9 14t-9-14z" fill="#020b18" stroke="#82eaff" stroke-width="2" opacity="0"/>
    </g>
    <path d="M100 101v5" stroke="#5bbadf" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>
  </g>

  <g opacity=".85" filter="url(#glow)">
    <path d="M25 132v10m-5-5h10M175 132v10m-5-5h10" stroke="#64ddff" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>