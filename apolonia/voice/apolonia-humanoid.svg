<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">APOLONIA mechanical humanoid</title>
  <desc id="desc">A navy, silver and cyan upper-body robot with a mechanical crown, expressive bionic eyes and articulated arms.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2fbff"/><stop offset=".45" stop-color="#9bc9df"/><stop offset="1" stop-color="#285778"/></linearGradient>
    <linearGradient id="darkShell" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173d5d"/><stop offset="1" stop-color="#061426"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173b5b"/><stop offset=".6" stop-color="#091d34"/><stop offset="1" stop-color="#04101f"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaffff"/><stop offset=".45" stop-color="#7beaff"/><stop offset="1" stop-color="#159acb"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <ellipse cx="120" cy="270" rx="76" ry="5" fill="#020914" opacity=".7"/>

  <!-- Shoulder-mounted arms: all moving parts remain inside their shoulder group. -->
  <g id="leftArm" class="arm">
    <path d="M88 204 58 214 43 235 55 244 73 228 96 222Z" fill="url(#shell)" stroke="#07182d" stroke-width="3.5"/>
    <path d="m58 218-12 17 9 7 18-15" stroke="#eafaff" stroke-width="2.2"/>
    <circle cx="58" cy="236" r="7" fill="#0a2945" stroke="#70e5ff" stroke-width="2.5"/>
    <path d="M52 240 39 255l7 11 18-7 9-19-10-7Z" fill="url(#darkShell)" stroke="#07182d" stroke-width="3"/>
    <path d="m47 252 14-5m-10 12 13-5" stroke="#7beaff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="88" cy="210" r="12" fill="url(#shell)" stroke="#07182d" stroke-width="3.5"/>
    <circle cx="88" cy="210" r="5" fill="#082642" stroke="#70e5ff" stroke-width="2"/>
    <g id="leftHand">
      <path d="m42 258-8 7 2 8 8-3 4 6 5-5 7 3 4-8-7-7" fill="url(#shell)" stroke="#07182d" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="m39 265 7 2m2-2 3 8m5-8 4 4" stroke="#83edff" stroke-width="1.7" stroke-linecap="round"/>
    </g>
  </g>
  <g id="rightArm" class="arm">
    <path d="m152 204 30 10 15 21-12 9-18-16-23-6Z" fill="url(#shell)" stroke="#07182d" stroke-width="3.5"/>
    <path d="m182 218 12 17-9 7-18-15" stroke="#eafaff" stroke-width="2.2"/>
    <circle cx="182" cy="236" r="7" fill="#0a2945" stroke="#70e5ff" stroke-width="2.5"/>
    <path d="m188 240 13 15-7 11-18-7-9-19 10-7Z" fill="url(#darkShell)" stroke="#07182d" stroke-width="3"/>
    <path d="m193 252-14-5m10 12-13-5" stroke="#7beaff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="152" cy="210" r="12" fill="url(#shell)" stroke="#07182d" stroke-width="3.5"/>
    <circle cx="152" cy="210" r="5" fill="#082642" stroke="#70e5ff" stroke-width="2"/>
    <g id="rightHand">
      <path d="m198 258 8 7-2 8-8-3-4 6-5-5-7 3-4-8 7-7" fill="url(#shell)" stroke="#07182d" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="m201 265-7 2m-2-2-3 8m-5-8-4 4" stroke="#83edff" stroke-width="1.7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Chest and central spine -->
  <g id="torso">
    <path d="M88 190 72 202l7 28 41 13 41-13 7-28-16-12-32 9Z" fill="url(#darkShell)" stroke="#07182d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="m88 194-10 11 8 17 34 11 34-11 8-17-10-11-32 8Z" fill="url(#shell)" stroke="#0a2945" stroke-width="2.5"/>
    <path d="m101 202 19-5 19 5-5 23-14 7-14-7Z" fill="#071a30" stroke="#72e5ff" stroke-width="2"/>
    <path d="M114 205h12l-2 54h-8Z" fill="url(#shell)" stroke="#07182d" stroke-width="2.5"/>
    <path d="M116 215h8m-8 9h8m-8 9h8" stroke="#70e5ff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="120" cy="238" r="4" fill="#061426" stroke="#8af0ff" stroke-width="1.8"/>
    <path d="m78 215-13 8 7 11 16-8m74-11 13 8-7 11-16-8" stroke="#9feaff" stroke-width="2" opacity=".8"/>
  </g>

  <!-- Neck -->
  <path d="M105 181h30v20h-30z" fill="url(#darkShell)" stroke="#07182d" stroke-width="3"/>
  <path d="M111 188h18v5h-18z" fill="#70e5ff" opacity=".8"/>

  <!-- Animated head: the full helmet and face rotate together around the neck pivot. -->
  <g id="headPivot">
    <!-- Helmet dome and mechanical crown -->
    <path d="M56 105C56 54 84 22 120 22s64 32 64 83" stroke="#07182d" stroke-width="5"/>
    <path d="M64 102C64 60 88 30 120 30s56 30 56 72" stroke="url(#cyan)" stroke-width="3"/>
    <path d="M84 38c10-6 22-8 36-8s26 2 36 8" stroke="#8deeff" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="115" y="30" width="10" height="44" rx="2" fill="url(#shell)" stroke="#07182d" stroke-width="2.5"/>
    <path d="M120 30v44" stroke="#70e5ff" stroke-width="1.5"/>
    <circle cx="88" cy="66" r="12" fill="url(#darkShell)" stroke="#8beeff" stroke-width="2.5"/>
    <circle cx="88" cy="66" r="5" fill="#07182d" stroke="#70e5ff" stroke-width="1.5"/>
    <circle cx="152" cy="66" r="12" fill="url(#darkShell)" stroke="#8beeff" stroke-width="2.5"/>
    <circle cx="152" cy="66" r="5" fill="#07182d" stroke="#70e5ff" stroke-width="1.5"/>
    <path d="M74 84l16-6h60l16 6" stroke="#07182d" stroke-width="3"/>
    <rect x="108" y="72" width="24" height="8" rx="2" fill="url(#shell)" stroke="#07182d" stroke-width="2.5"/>

    <!-- Antennae and side audio modules -->
    <path d="m52 108-8-8V78m136 30 8-8V78" stroke="#07182d" stroke-width="3"/>
    <circle cx="44" cy="75" r="3.5" fill="#78e8ff" stroke="#07182d" stroke-width="1.5"/>
    <circle cx="196" cy="75" r="3.5" fill="#78e8ff" stroke="#07182d" stroke-width="1.5"/>
    <path d="m40 68-2-3m6 1v-3m4 5 2-3m142 3-2-3m6 1v-3m4 5 2-3" stroke="#78e8ff" stroke-width="1.5"/>
    <rect x="48" y="90" width="14" height="56" rx="6" fill="url(#shell)" stroke="#07182d" stroke-width="3"/>
    <path d="M54 98v40" stroke="#2d739b" stroke-width="2"/>
    <rect x="178" y="90" width="14" height="56" rx="6" fill="url(#shell)" stroke="#07182d" stroke-width="3"/>
    <path d="M186 98v40" stroke="#2d739b" stroke-width="2"/>

    <!-- Face visor and jaw -->
    <path d="M68 104c0-16 20-22 52-22s52 6 52 22v28c0 26-24 52-52 62-28-10-52-36-52-62v-28z" fill="url(#visor)" stroke="#07182d" stroke-width="4"/>
    <path d="M74 106c0-12 18-17 46-17s46 5 46 17v24c0 22-21 45-46 54-25-9-46-32-46-54v-24z" stroke="#69ddff" stroke-width="1.8" opacity=".55"/>
    <path d="M80 106c10-3 22-1 30 4m50-4c-10-3-22-1-30 4" stroke="#a8edff" stroke-width="3" stroke-linecap="round"/>

    <!-- Bionic eyes -->
    <g id="eyes">
      <path d="M78 122c8-8 24-8 32 0-8 9-24 9-32 0z" stroke="#8cecff" stroke-width="2.5"/>
      <circle cx="94" cy="122" r="8" fill="#09233d" stroke="#70e5ff" stroke-width="2"/>
      <circle cx="94" cy="122" r="4" fill="#e8fdff"/>
      <path d="M90 132l8 8m-2-8 7 7" stroke="#8cecff" stroke-width="2"/>
      <path d="M130 122c8-8 24-8 32 0-8 9-24 9-32 0z" stroke="#8cecff" stroke-width="2.5"/>
      <circle cx="146" cy="122" r="8" fill="#09233d" stroke="#70e5ff" stroke-width="2"/>
      <circle cx="146" cy="122" r="4" fill="#e8fdff"/>
      <path d="m150 132-8 8m2-8-7 7" stroke="#8cecff" stroke-width="2"/>
    </g>
    <g id="pupils">
      <circle id="pupilLeft" cx="94" cy="122" r="3" fill="#061426"/>
      <circle id="pupilRight" cx="146" cy="122" r="3" fill="#061426"/>
    </g>
    <g id="eyelids" opacity="0">
      <path d="M78 122q16-18 32 0v8q-16 8-32 0zm52 0q16-18 32 0v8q-16 8-32 0z" fill="#07182d" stroke="#69ddff" stroke-width="1.5"/>
    </g>

    <!-- Nose, animated mouth and chin plate -->
    <path d="M115 136v12c0 2 2 3 5 3s5-1 5-3v-12" stroke="#83eaff" stroke-width="2"/>
    <g id="mouthGroup">
      <path id="mouthLine" d="M107 166c5-3 9-2 13 0 4-2 8-3 13 0" stroke="#9af1ff" stroke-width="2.5" stroke-linecap="round"/>
      <path id="mouthOpen" d="M107 165c5-3 9-2 13 0 4-2 8-3 13 0-5 7-9 8-13 8s-8-1-13-8z" fill="#020b18" stroke="#82eaff" stroke-width="2" opacity="0"/>
    </g>
    <path d="M114 176h12" stroke="#82eaff" stroke-width="2"/>
    <path d="M116 184h8v10h-8z" fill="#07182d" stroke="#70e5ff" stroke-width="1.5"/>
    <path d="M25 132v10m-5-5h10m145-5v10m-5-5h10" stroke="#64ddff" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>
  </g>
</svg>