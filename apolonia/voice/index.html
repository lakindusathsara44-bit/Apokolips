<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914"><meta name="description" content="APOLONIA Voice — live voice-only AI conversations.">
<title>APOLONIA Voice | Apokolips</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./voice.css?v=20261123a">
<script>window.APOKOLIPS_APOLONIA_API='https://apolonia-ai-api.netlify.app';</script>
<script defer src="./voice.js?v=20261123a"></script>
</head>
<body>
<main class="voice-shell">
<header class="topbar">
<a class="wordmark" href="/" aria-label="Apokolips home"><span class="wordmark-mark">A</span><span>APOKOLIPS</span></a>
<div class="mode-label"><span class="live-dot"></span> APOLONIA <b>VOICE</b></div>
<a class="text-mode" href="/?assistant=apolonia">TEXT MODE <span aria-hidden="true">↗</span></a>
</header>
<section class="stage" aria-label="APOLONIA voice assistant">
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<div class="globe-wrap" id="globeWrap" data-state="idle">
<div class="globe-orbit orbit-one"></div><div class="globe-orbit orbit-two"></div>
<div class="globe-grid"><span class="latitude lat-one"></span><span class="latitude lat-two"></span><span class="longitude lon-one"></span><span class="longitude lon-two"></span><span class="longitude lon-three"></span></div>
<div class="core-halo"></div><canvas id="voiceWave" width="720" height="720" aria-hidden="true"></canvas>
<div class="core"><span class="core-letter">A</span><span class="core-label">APOLONIA</span></div><div class="globe-sheen"></div>
</div>
<div class="assistant-copy"><p class="eyebrow">LIVE VOICE INTERFACE</p><h1>Talk to <span>APOLONIA</span></h1><p class="status-line" id="statusLine" aria-live="polite">Your voice assistant is standing by.</p><p class="phoneme-readout" id="phonemeReadout">VOICE CORE <i>·</i> STANDBY</p></div>
</section>
<footer class="controls">
<div class="control-hint" id="controlHint">Press start and allow microphone access.</div>
<div class="control-row">
<button class="end-button" id="endButton" type="button" disabled aria-label="End voice conversation"><span>■</span></button>
<button class="start-button" id="startButton" type="button"><span class="mic-icon" aria-hidden="true">⌁</span><span id="startLabel">Start conversation</span></button>
<button class="mute-button" id="muteButton" type="button" disabled aria-label="Mute or resume microphone"><span id="muteIcon">Ⅱ</span></button>
</div>
<div class="footer-note">VOICE ONLY <span>•</span> APOLONIA AI <span>•</span> APOKOLIPS</div>
</footer>
</main>
</body></html>
