<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18">
<title>Published Posts · Apokolips Blog Uploader</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101a2b;--line:#233650;--muted:#9aacc4;--cyan:#35d5ff;--blue:#287bff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#10284a 0,transparent 42%),var(--bg);color:#edf6ff;font:15px/1.55 Inter,system-ui,Segoe UI,sans-serif}
header{padding:22px max(18px,calc((100% - 1120px)/2));border-bottom:1px solid #1b2c43;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font-weight:850;letter-spacing:.08em}.brand span{color:var(--cyan)}nav{display:flex;gap:9px;flex-wrap:wrap}nav a,.btn{color:#dceaff;text-decoration:none;border:1px solid #304967;background:#14243a;padding:9px 13px;border-radius:10px;font-size:13px}
main{max-width:1120px;margin:34px auto;padding:0 18px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.18em;font-weight:800}h1{font-size:clamp(28px,5vw,42px);margin:7px 0}.sub{color:var(--muted);margin:0 0 22px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:22px 0}.toolbar input,.toolbar select{background:#091321;color:white;border:1px solid #2a405d;border-radius:10px;padding:11px;font:inherit}.toolbar input{flex:1;min-width:150px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:17px}.post{background:linear-gradient(145deg,#111e31,#0d1625);border:1px solid var(--line);border-radius:17px;overflow:hidden}.media{width:100%;height:220px;object-fit:cover;background:#07101c;display:block}.text-media{min-height:180px;padding:22px;white-space:pre-wrap;overflow-wrap:anywhere;color:#dceaff;background:radial-gradient(ellipse at top left,#17385a66,transparent 65%),#091321}.content{padding:17px}.meta{color:var(--muted);font-size:12px}.content h2{font-size:18px;margin:6px 0 9px}.description{color:#c4d4e8;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.metrics{display:flex;gap:14px;flex-wrap:wrap;padding:12px 0;border-top:1px solid #243751;margin-top:13px;color:#b9d9f7;font-size:13px}.open{display:inline-block;margin-top:6px;color:var(--cyan);text-decoration:none;font-weight:700;font-size:13px}.status{padding:18px;border:1px solid var(--line);border-radius:12px;color:var(--muted);background:#0d1726}.empty{grid-column:1/-1}.foot{text-align:center;color:#7186a1;font-size:12px;padding:30px}
@media(max-width:600px){.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style><link rel="stylesheet" href="./studio.css"></head>
<body>
<header><div><div class="brand">APOKOLIPS<span>.</span> BLOG</div><div class="meta">PUBLISHED CONTENT LIBRARY</div></div><nav><a href="./index.html">Uploader</a><a href="./insights.html">Insights</a><a href="./posts.html">All posts</a></nav></header>
<main><div class="eyebrow">YOUR CONTENT</div><h1>Published posts.</h1><p class="sub">Browse every post published through this uploader, with live Like and Comment totals from the Apokolips community service.</p>
<div class="toolbar"><input id="search" type="search" placeholder="Search posts…" aria-label="Search posts"><select id="filter" aria-label="Filter posts"><option value="all">All types</option><option value="image">Images</option><option value="video">Videos</option><option value="text">Text</option></select><button class="btn" id="refresh">Refresh</button></div>
<div id="status" class="status" role="status">Loading published posts…</div><section id="posts" class="grid" aria-live="polite"></section></main>
<div class="foot">APOKOLIPS · Ideas become something real.</div>
<script type="module">
import { loadPosts, loadEngagement, formatDate } from './analytics.js';
const $=id=>document.getElementById(id);let posts=[],metrics={byPost:{}};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
 const q=$('search').value.trim().toLowerCase(),f=$('filter').value;
 const filtered=posts.filter(p=>(f==='all'||p.type===f)&&(!q||[p.title,p.description,p.filename].join(' ').toLowerCase().includes(q)));
 $('posts').innerHTML=filtered.length?filtered.map(p=>{
  const m=metrics.byPost[p.slug]||{likes:0,comments:0};
  const media=p.type==='image'?'<img class="media" loading="lazy" src="'+esc(p.mediaUrl)+'" alt="'+esc(p.title)+'">':p.type==='video'?'<video class="media" controls preload="metadata" src="'+esc(p.mediaUrl)+'"></video>':'<div class="text-media">'+esc(p.description)+'</div>';
  return '<article class="post">'+media+'<div class="content"><div class="meta">'+esc(formatDate(p.date))+' · '+esc(p.type.toUpperCase())+'</div><h2>'+esc(p.title)+'</h2><p class="description">'+esc(p.description)+'</p><div class="metrics"><span>👍 '+m.likes.toLocaleString()+' Likes</span><span>💬 '+m.comments.toLocaleString()+' Comments</span></div><a class="open" target="_blank" rel="noopener" href="https://apokolips.xyz/blog.html#'+encodeURIComponent(p.id)+'">Open on Apokolips ↗</a></div></article>';
 }).join(''):'<div class="status empty">No posts match this search.</div>';
 $('status').textContent=posts.length+' published post'+(posts.length===1?'':'s')+' · '+filtered.length+' shown';
}
async function refresh(){
 $('status').textContent='Refreshing posts and community metrics…';
 try{[posts,metrics]=await Promise.all([loadPosts(),loadEngagement()]);render();}
 catch(e){$('status').textContent='Could not load all data: '+e.message+' · Check the public post index and Neon anonymous read access.';}
}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('refresh').addEventListener('click',refresh);refresh();
</script><script defer src="./studio.js"></script></body></html>
